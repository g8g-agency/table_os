# Reverse Proxy Configuration

# Define upstream servers
upstream backend {
    server backend:3001;
}

upstream frontend {
    server frontend:80;
}

# HTTP to HTTPS Redirection (Catch-all)
server {
    listen 80 default_server;
    server_name _;
    
    # Enable this redirect when SSL is configured
    # return 301 https://$host$request_uri;

    # For now, without SSL, we'll just serve directly or respond with 404
    location / {
        return 404 "SSL Not Configured. Direct HTTP access not allowed.";
    }
}

# API Server Block
server {
    listen 80;
    # listen 443 ssl;
    server_name api.demo.domain.com;

    # ssl_certificate /etc/letsencrypt/live/demo.domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/demo.domain.com/privkey.pem;

    client_max_body_size 10M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Support for Realtime
    location /api/v1/realtime {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400; # Keep WS connection open
    }
}

